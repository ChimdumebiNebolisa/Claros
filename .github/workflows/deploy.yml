name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Pre-deploy verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest with coverage gate
        run: pytest tests/ --cov --cov-config=pyproject.toml --cov-report=term-missing -q

      - name: Product contract evaluations
        run: |
          python -m evaluation.canonical_v1.evaluate --out /tmp/canonical-v1.json
          python -m evaluation.worksheet_contract_v1.evaluate --out /tmp/worksheet-contract-v1.json
          python scripts/verify_demo.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Frontend CI checks
        run: npm run ci:frontend

      - name: Build production image
        run: docker build -t claros:predeploy .

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE_NAME: claros
      REGION: us-central1
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build frontend bundles
        run: |
          npm ci
          npm ci --prefix marketing
          npm run build:landing
          npm run build:genai

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and push image
        run: |
          IMAGE="gcr.io/${PROJECT_ID}/${SERVICE_NAME}:${GITHUB_SHA}"
          gcloud builds submit --tag "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --image "$IMAGE" \
            --platform managed \
            --region "$REGION" \
            --allow-unauthenticated \
            --service-account "${{ secrets.GCP_RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars "APP_ENV=production,CLAROS_STORAGE_BACKEND=gcs,DOCUMENT_SEMANTIC_PROVIDER=gemini,GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }},GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},MAX_PDF_PAGES=8,MAX_WORKSHEET_QUESTIONS=40,MAX_SEMANTIC_PROVIDER_CALLS=8,SEMANTIC_PROVIDER_TIMEOUT_MS=15000,MAX_CONCURRENT_UPLOADS=1" \
            --set-secrets "SESSION_HMAC_SECRET=claros-session-hmac:latest,GEMINI_API_KEY=claros-gemini-api-key:latest" \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 2 \
            --timeout 300 \
            --deploy-health-check \
            --startup-probe "httpGet.path=/health,httpGet.port=8080,timeoutSeconds=3,periodSeconds=5,failureThreshold=12" \
            --liveness-probe "httpGet.path=/health,httpGet.port=8080,timeoutSeconds=3,periodSeconds=30,failureThreshold=3"

      - name: Post-deploy smoke check
        if: env.PROJECT_ID != ''
        run: |
          URL=$(gcloud run services describe "$SERVICE_NAME" --region "$REGION" --format='value(status.url)')
          echo "Probing $URL"
          curl -fsS "$URL/health" >/dev/null
          curl -fsS "$URL/" >/dev/null
          curl -fsS "$URL/app" >/dev/null
          curl -fsS "$URL/styles/tokens.css" >/dev/null
          echo "Post-deploy smoke checks passed"
