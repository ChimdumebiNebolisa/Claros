name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Pytest with coverage gate
        run: pytest tests/ --cov --cov-config=pyproject.toml --cov-report=term-missing --cov-report=xml

      - name: Product contract evaluations
        run: |
          python -m evaluation.canonical_v1.evaluate --out /tmp/canonical-v1.json
          python -m evaluation.worksheet_contract_v1.evaluate --out /tmp/worksheet-contract-v1.json
          python scripts/verify_demo.py

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Metrics script
        run: python scripts/metrics.py

  frontend:
    name: Frontend contract & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Frontend CI checks
        run: npm run ci:frontend

      - name: Upload genai bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: genai-bundle
          path: frontend/genai.bundle.js
          if-no-files-found: error

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t claros:ci .

      - name: Smoke test container boots
        run: |
          docker run -d --name claros-ci -e PORT=8080 -p 8080:8080 claros:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null && curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              echo "health check passed"
              docker logs claros-ci | tail -n 20
              docker rm -f claros-ci
              exit 0
            fi
            sleep 2
          done
          echo "container failed to serve landing page"
          docker logs claros-ci || true
          docker rm -f claros-ci
          exit 1
