[tool.coverage.run]
source = [
    "agent",
    "assignment_service",
    "config",
    "exporter",
    "gemini_service",
    "main",
    "manifest",
    "parser",
    "parser_layout",
    "schemas",
    "session_service",
    "storage",
    "observability",
    "ocr_adapter",
]
omit = [
    "tests/*",
    "test_*.py",
    "generate_test_pdf.py",
    "scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
fail_under = 72
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["."]
extend-exclude = [
    "frontend/genai.bundle.js",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
